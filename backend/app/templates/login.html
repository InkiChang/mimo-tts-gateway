<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mimo-tts-gateway - Login</title>
    <link rel="stylesheet" href="/static/css/app.css">
    <style>
        .login-box {
            max-width: 400px;
            margin: 80px auto;
            padding: 32px;
            background: var(--bg-secondary);
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .login-box h1 {
            text-align: center;
            margin-bottom: 24px;
        }
        .login-box input {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
        }
        .login-box button {
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>mimo-tts-gateway</h1>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="post" action="/admin/login">
            <input type="text" name="username" placeholder="Username" required autofocus>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
